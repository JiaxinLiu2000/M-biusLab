spring:
  application:
    name: mobius-lab
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MOBIUS_DB_URL:jdbc:mysql://localhost:3307/mobiuslab?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=UTC}
    username: ${MOBIUS_DB_USER:mobiuslab}
    password: ${MOBIUS_DB_PASSWORD:mobiuslab}
    hikari:
      maximum-pool-size: 32
      minimum-idle: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mobius:
  version: '@project.version@'
  home: ${MOBIUS_HOME:./runtime}
  crusoe:
    base-url: https://api.inference.crusoecloud.com/v1
    api-key: ${CRUSOE_API_KEY:}
    timeout: 120s
    max-retries: 4
  jev:
    base-url: https://api.typesafe.ai
    api-key: ${TYPESAFE_API_KEY:}
    timeout: 15s
    max-retries: 4
  qdrant:
    url: ${MOBIUS_QDRANT_URL:http://localhost:6333}
    timeout: 10s
  web-search:
    you-api-key: ${YDC_API_KEY:}
  monitor:
    queue-capacity: 50000
    batch-size: 500
    flush-interval: 500ms
    recent-buffer: 5000
  budget:
    credit-usd: 50.0
    warn-ratio: 0.8

logging:
  level:
    root: INFO
    ai.mobiuslab: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%X{agentId:-}] %logger{36} - %msg%n"
