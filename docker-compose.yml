# Local infrastructure for Möbius Lab: MySQL (relational store) and Qdrant (vector store).
services:
  mysql:
    image: mysql:8.4
    container_name: mobiuslab-mysql
    environment:
      MYSQL_DATABASE: mobiuslab
      MYSQL_USER: mobiuslab
      MYSQL_PASSWORD: mobiuslab
      MYSQL_ROOT_PASSWORD: mobiuslab-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-connections=500"]
    ports: ["3307:3306"]
    volumes: ["mobiuslab-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umobiuslab", "-pmobiuslab"]
      interval: 5s
      retries: 30
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mobiuslab-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["mobiuslab-qdrant:/qdrant/storage"]
volumes:
  mobiuslab-mysql:
  mobiuslab-qdrant:
